<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #09090b;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      
      .canvas-container {
        width: 1920px;
        height: 1080px;
        position: relative;
        background: radial-gradient(circle at 50% 40%, #1e1b4b 0%, #09090b 70%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ffffff;
      }

      .glowing-orb {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(249,115,22,0.3) 0%, rgba(139,92,246,0.2) 50%, rgba(0,0,0,0) 70%);
        filter: blur(40px);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: rgba(249, 115, 22, 0.15);
        border: 1px solid rgba(249, 115, 22, 0.4);
        padding: 12px 28px;
        border-radius: 999px;
        color: #f97316;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 30px;
        backdrop-filter: blur(10px);
      }

      .title {
        font-size: 84px;
        font-weight: 900;
        letter-spacing: -2px;
        background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 50%, #f97316 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        text-align: center;
        line-height: 1.1;
        margin-bottom: 24px;
        max-width: 1400px;
      }

      .subtitle {
        font-size: 32px;
        color: #94a3b8;
        text-align: center;
        max-width: 1000px;
        line-height: 1.5;
        font-weight: 400;
      }

      .tech-tag {
        position: absolute;
        bottom: 60px;
        font-size: 20px;
        color: #64748b;
        font-family: monospace;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="root-main" id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080" class="canvas-container">
      <div data-hf-id="hf-giay" class="glowing-orb" id="orb"></div>
      <div data-hf-id="hf-oifd" class="badge" id="badge">⚡ CONTENT OS • HYPERFRAME STUDIO</div>
      <h1 data-hf-id="hf-p7mq" class="title" id="title">AUTOMATED HYPERFRAME VIDEO</h1>
      <p data-hf-id="hf-tvym" class="subtitle" id="subtitle">Programmatic motion asset compiled directly into Assets Vault (database/assets_vault/videos/)</p>
      <div data-hf-id="hf-nfnq" class="tech-tag" id="tag">Rendered via HeyGen Hyperframe CLI • 1080p @ 30 FPS</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#orb", { scale: 0.5, opacity: 0, duration: 2, ease: "power3.out" }, 0)
        .from("#badge", { y: -40, opacity: 0, duration: 1, ease: "back.out(1.7)" }, 0.3)
        .from("#title", { y: 50, opacity: 0, duration: 1.2, ease: "power4.out" }, 0.6)
        .from("#subtitle", { opacity: 0, y: 30, duration: 1, ease: "power2.out" }, 1.0)
        .from("#tag", { opacity: 0, duration: 1 }, 1.5)
        .to("#orb", { scale: 1.2, duration: 4, yoyo: true, repeat: -1, ease: "sine.inOut" }, 2.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
